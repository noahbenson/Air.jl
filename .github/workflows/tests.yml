name: CI

on:
  push:
    branches: [master]
  # Deliberately not restricted to PRs targeting `master`: PRs stacked on
  # another feature branch need CI too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS
          - '1.11'
          - '1'      # latest release
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        threads:
          - '4'
        exclude:
          - os: macos-latest
            version: nightly
          - os: windows-latest
            version: nightly
        include:
          # A single-threaded sanity leg: ensures the library also works
          # without the multithreaded STM test coverage.
          - os: ubuntu-latest
            version: '1.10'
            threads: '1'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          show-versioninfo: true
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          julia_args: --threads=${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # Static analysis with JET. JET is sensitive to the Julia version, so this is
  # advisory rather than a merge gate.
  quality:
    name: JET
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Report type errors
        run: |
          # JET is added to a throwaway environment that also has Air itself, so
          # that `using Air` resolves (the test project does not contain it;
          # `Pkg.test` injects it only for the test run).
          julia --project=@jet -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.add("JET")'
          julia --project=@jet -e 'using JET, Air; report_package(Air)'
