name: CI

on:
  push:
    branches: [master]
  # Deliberately not restricted to PRs targeting `master`: PRs stacked on
  # another feature branch need CI too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS
          - '1.11'
          # The latest release (1.13 at the time of writing) is not listed
          # here: it requires the `IndexStyle` fix that lands in the follow-up
          # correctness PR. Nightly is included as an advisory leg below.
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        threads:
          - '4'
        exclude:
          - os: macos-latest
            version: nightly
          - os: windows-latest
            version: nightly
        include:
          # A single-threaded sanity leg: ensures the library also works
          # without the multithreaded STM test coverage.
          - os: ubuntu-latest
            version: '1.10'
            threads: '1'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          show-versioninfo: true
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          julia_args: --threads=${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
