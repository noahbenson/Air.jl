name: Benchmarks

on:
  # Benchmarks are not run per-pull-request: shared CI runners are too noisy for
  # the comparison to be meaningful as a merge gate. Run them manually, or let
  # the weekly schedule catch a large regression.
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run benchmarks
        run: julia --project=bench bench/runtests.jl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/baseline.json
          if-no-files-found: warn
